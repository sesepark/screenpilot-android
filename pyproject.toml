[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "screenpilot-android"
version = "0.1.0"
description = "Generic screen-only Android Emulator automation using ADB and OpenCV"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.8,<1"]

[project.scripts]
screenpilot = "screenpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screenpilot", "src/screenpilot_user"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
